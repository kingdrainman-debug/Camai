name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      # Every parameter and section must be documented, and every preset must
      # name only parameters that exist. A data check, so it runs first.
      - name: Help and presets
        run: npm run help:check

      - name: Install Chromium for the smoke test
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      # tsc cannot catch a shader that fails to compile, a worklet that fails
      # to register, or a parameter that never reaches the picture. The smoke
      # test drives the built bundle in a real browser — through the interface,
      # and through a probe that measures the camcorder itself: the field
      # clock, DCT blocking against FFmpeg's real DV encoder, the shared bit
      # budget, chroma bleed, smear, overlay paths, dropouts, the A/V link.
      - name: Smoke test
        run: npm run smoke

      - name: Verify the Windows packaging config
        # `dir` is the one Windows target that needs no wine, so the packaging
        # configuration is validated on every push rather than only on release.
        # Resource editing is skipped because that is the step wine is for.
        run: npx electron-builder --win dir --x64 -c.win.signAndEditExecutable=false

      - name: Confirm the exe was produced
        run: test -f release/win-unpacked/CAMAI.exe && echo "CAMAI.exe packaged"
